      <stop offset="0" stop-color="#05070F" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="0.75" stop-color="#A855F7"/>
