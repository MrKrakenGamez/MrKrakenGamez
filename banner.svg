<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Mike Kraken — Full Stack, DevOps, Tech Lead" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070F"/><stop offset="1" stop-color="#0A1128"/></linearGradient>
    <radialGradient id="gv" cx="0.82" cy="0.1" r="0.6"><stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc" cx="0.1" cy="1" r="0.55"><stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#E6EDF7"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect width="1600" height="400" rx="0"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .star{animation:tw 4s ease-in-out infinite}
    .s2{animation-delay:1.3s}.s3{animation-delay:2.4s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .fade{animation:fi 1.4s ease-out both}
    @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .sway{animation:sw 8s ease-in-out infinite alternate;transform-origin:1230px 400px}
    @keyframes sw{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
    .wave{animation:wv 10s ease-in-out infinite alternate}
    @keyframes wv{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1600" height="400" fill="url(#bg)"/>
    <rect width="1600" height="400" fill="url(#gv)"/>
    <rect width="1600" height="400" fill="url(#gc)"/>
    <!-- estrellas -->
    <g fill="#E6EDF7">
      <circle class="star" cx="120" cy="60" r="1.5"/><circle class="star s2" cx="340" cy="110" r="1.2"/><circle class="star s3" cx="560" cy="48" r="1.6"/>
      <circle class="star s2" cx="760" cy="92" r="1.2"/><circle class="star" cx="940" cy="40" r="1.5"/><circle class="star s3" cx="1100" cy="120" r="1.2"/>
      <circle class="star" cx="1420" cy="70" r="1.6"/><circle class="star s2" cx="1520" cy="150" r="1.2"/><circle class="star s3" cx="60" cy="190" r="1.2"/>
    </g>
    <!-- kraken lineal (derecha) -->
    <g class="sway" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".9">
      <path d="M1150 400 C1150 330 1190 300 1230 300 C1270 300 1310 330 1310 400" />
      <path d="M1160 250 C1160 190 1195 160 1230 160 C1265 160 1300 190 1300 250 C1300 290 1270 305 1230 305 C1190 305 1160 290 1160 250 Z"/>
      <path d="M1190 235 q10 -10 20 0 M1250 235 q10 -10 20 0" stroke-width="2.5"/>
      <path d="M1175 290 C1120 300 1090 340 1100 400"/><path d="M1195 300 C1170 340 1160 370 1170 400"/>
      <path d="M1265 300 C1290 340 1300 370 1290 400"/><path d="M1285 290 C1340 300 1370 340 1360 400"/>
      <path d="M1170 270 C1100 260 1060 290 1050 330 C1046 355 1066 365 1078 352"/>
      <path d="M1290 270 C1360 260 1400 290 1410 330 C1414 355 1394 365 1382 352"/>
    </g>
    <!-- olas -->
    <g class="wave" opacity=".5"><path d="M-60 372 Q 100 340 260 372 T 580 372 T 900 372 T 1220 372 T 1540 372 T 1700 372 V400 H-60Z" fill="#7C3AED" opacity=".25"/></g>
    <g class="wave" style="animation-direction:alternate-reverse" opacity=".6"><path d="M-60 384 Q 100 360 260 384 T 580 384 T 900 384 T 1220 384 T 1540 384 T 1700 384 V400 H-60Z" fill="#22D3EE" opacity=".18"/></g>
    <!-- tarjeta glass -->
    <g class="fade">
      <rect x="80" y="84" width="760" height="232" rx="24" fill="#0A1128" fill-opacity=".55" stroke="#7C3AED" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="81" y="85" width="758" height="230" rx="23" fill="none" stroke="#E6EDF7" stroke-opacity=".06"/>
      <text class="m" x="120" y="134" font-size="18" fill="#22D3EE">~/mike-kraken <tspan fill="#94A3B8">$ whoami</tspan></text>
      <text class="t" x="118" y="214" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-2">Mike Kraken</text>
      <text class="t" x="120" y="262" font-size="26" fill="#E6EDF7" fill-opacity=".9">Full Stack · DevOps · Tech Lead</text>
      <text class="m" x="120" y="296" font-size="16" fill="#94A3B8">.NET 8 + Angular — del legacy al cloud</text>
      <rect x="120" y="226" width="96" height="3" rx="1.5" fill="url(#line)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
